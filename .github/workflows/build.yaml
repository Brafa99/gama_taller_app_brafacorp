- name: Reparar estructura Android, inyectar ícono oficial y generar launcher
        run: |
          cp android/app/google-services.json ./google-services.json.bak
          if [ -f "assets/gama_icon.jpeg" ]; then cp assets/gama_icon.jpeg ./gama_icon.jpeg.bak; fi
          
          rm -rf android
          flutter create --platforms=android --org com.example --project-name taller_gama .
          
          mv ./google-services.json.bak android/app/google-services.json
          if [ -f "./gama_icon.jpeg.bak" ]; then 
            mkdir -p assets
            mv ./gama_icon.jpeg.bak assets/gama_icon.jpeg
          fi

          # Asegurar dependencias de iconos y ejecutarlas en el servidor
          flutter pub add flutter_launcher_icons || true
          flutter pub run flutter_launcher_icons || true

          if [ -f "android/settings.gradle.kts" ]; then
            sed -i '/id("org.jetbrains.kotlin.android")/a \    id("com.google.gms.google-services") version "4.4.1" apply false' android/settings.gradle.kts
            sed -i '/id("dev.flutter.flutter-plugin-loader")/a \    id("com.google.gms.google-services")' android/app/build.gradle.kts
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          else
            sed -i '/id "org.jetbrains.kotlin.android"/a \    id "com.google.gms.google-services" version "4.4.1" apply false' android/settings.gradle
            sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          fi
          
          sed -i 's/android:label="taller_gama"/android:label="Gama Taller"/g' android/app/src/main/AndroidManifest.xml || true
